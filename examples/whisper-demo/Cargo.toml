[package]
name = "candle-wasm-example-whisper"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
featurize-core = { path = "../../crates/core" }
num-traits = "0.2"
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }

# App crates.
anyhow = "1.0"
log = "0.4"
rand = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
safetensors = "0.4"

# Wasm specific crates.
gloo = "0.12"
js-sys = "0.3.64"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "0.4.37"
wasm-logger = "0.2"
yew-agent = "0.2.0"
yew = { version = "0.23.0", features = ["csr"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3.70"
features = [
  'Blob',
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
  'Request',
  'RequestCache',
  'RequestInit',
  'RequestMode',
  'Response',
  'Performance',
]
