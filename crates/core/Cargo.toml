[package]
name = "featurize-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
burn = ["dep:burn"]
candle = ["dep:candle-core"]

[dependencies]
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
burn = { version = "0.21.0", default-features = false, optional = true }
candle-core = { version = "0.8", default-features = false, optional = true }
bytemuck = { version = "1.25.2", features = ["derive"] }
const_format = "0.2.36"

[dev-dependencies]
trybuild = "1.0"
proptest = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "profile"
harness = false

[[test]]
name = "prop_tests"

[[test]]
name = "unit_tests"

[[test]]
name = "integration_tests"
